<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#f8b786">
    <header class="bg-danger text-white py-3">
        <nav class="container d-flex justify-content-between align-items-center">
            <h1 class="h3">Zona de Productos</h1>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link text-white fw-bold" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-white fw-bold" href="agregar-producto.html">Agregar Producto</a></li>
                <li class="nav-item"><a class="nav-link text-white fw-bold" href="#">Chats</a></li>
            </ul>
        </nav>
    </header>

    <section class="container my-5">
        <div class="text-center mb-4">
            <h2 class="text-danger">Agregar Nuevo Producto</h2>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="Aproducto.php" method="POST" enctype="multipart/form-data" class="p-4 border rounded shadow-sm bg-white">
                    <div class="mb-3">
                        <label for="nombreProducto" class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" id="nombreProducto" name="nombreProducto" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="fotos" class="form-label fw-bold">Subir Imágenes (máximo 5)</label>
                        <input type="file" id="fotos" name="fotos[]" class="form-control" multiple accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Agregar Producto</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-secondary text-white text-center py-3">
        <p class="mb-0">© 2024 Zona de Productos. Todos los derechos reservados.</p>
    </footer>
</body>
</html>

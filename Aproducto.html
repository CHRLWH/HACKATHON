                  <i class="icon-first">

                    <img src="https://rafaelavlucas.github.io/assets/icons/gray1/icon-198.svg">

        </nav>
      </header>
    <div class="container">
    <section class="form-section ">
        <h2>Agregar Nuevo Producto</h2>
        <form action="#" method="POST" class="product-form">
            <label for="product-name">Nombre del Producto</label>
            <input type="text" id="product-name" name="product-name" required>

            <label for="product-description">Descripción</label>
            <textarea id="product-description" name="product-description" rows="4" required></textarea>

            <label for="product-price">Precio ($)</label>
            <input type="number" id="product-price" name="product-price" min="0" required>

            <button type="submit">Agregar Producto</button>
        </form>
    </section>
    
    
</div>

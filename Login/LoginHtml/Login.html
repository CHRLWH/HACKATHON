<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comunidad de madrid home</title>
    
    <link href="../LoginCss/Login.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
  <!--
  This was created based on the Dribble shot by Deepak Yadav that you can find at https://goo.gl/XRALsw

-->
<div class="fondoDiv"><img src="../../img/4-removebg-preview (1).png" width="200" height="100"></div>
<section class="user">
  <div class="user_options-container">
    <div class="user_options-text">
      <div class="user_options-unregistered">
        <h2 class="user_unregistered-title">Don't have an account?</h2>
        <p class="user_unregistered-text">Banjo tote bag bicycle rights, High Life sartorial cray craft beer whatever street art fap.</p>
        <button class="user_unregistered-signup" id="signup-button">Sign up</button>
      </div>

      <div class="user_options-registered">
        <h2 class="user_registered-title">Have an account?</h2>
        <p class="user_registered-text">Banjo tote bag bicycle rights, High Life sartorial cray craft beer whatever street art fap.</p>
        <button class="user_registered-login" id="login-button">Login</button>
      </div>
    </div>

    <div class="user_options-forms" id="user_options-forms">
      <div class="user_forms-login">
        <h2 class="forms_title">Login</h2>
        <form class="forms_form" action="../../Tienda/Html/TiendaV2.html" method="GET">
          <fieldset class="forms_fieldset">
            <div class="forms_field">
              <input type="email" placeholder="Email" class="forms_field-input" required autofocus />
            </div>
            <div class="forms_field">
              <input type="password" placeholder="Password" class="forms_field-input" required />
            </div>
          </fieldset>
          <div class="forms_buttons">
            <button type="button" class="forms_buttons-forgot">Forgot password?</button>
            <input type="submit" value="Log In" class="forms_buttons-action">
          </div>
        </form>
      </div>
      <div class="user_forms-signup">
        <h2 class="forms_title">Sign Up</h2>
        <form class="forms_form">
          <fieldset class="forms_fieldset">
            <div class="forms_field">
              <input type="text" placeholder="Full Name" class="forms_field-input" required />
            </div>
            <div class="forms_field">
              <input type="email" placeholder="Email" class="forms_field-input" required />
            </div>
            <div class="forms_field">
              <input type="password" placeholder="Password" class="forms_field-input" required />
            </div>
          </fieldset>
          <div class="forms_buttons">
            <input type="submit" value="Sign up" class="forms_buttons-action">
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="py-5 fondoDiv">
  <hr class="invisible">
  <div class="container text-center"> <!-- Clase 'text-center' para centrar el contenido -->
      <div class="row g-4 mb-5 justify-content-center"> <!-- Añadido 'justify-content-center' -->
          <div class="col-md-2">
              <a href="#" class="footer-link">Política de privacidad</a>
          </div>
          <div class="col-md-2">
              <a href="#" class="footer-link">Términos y condiciones</a>
          </div>
          <div class="col-md-2">
              <a href="#" class="footer-link">Ayuda</a>
          </div>
      </div>
      <div class="d-flex justify-content-center"> <!-- Añadido 'd-flex' y 'justify-content-center' -->
          <a class="navbar-brand" href="#">
              <img src="../../img/4-removebg-preview (1).png" alt="Logo" style="width: 100px; height: 50px; display: block;">
          </a>
      </div>
  </div>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script>
              /**
        * Variables
        */
              const signupButton = document.getElementById("signup-button"),
              loginButton = document.getElementById("login-button"),
              userForms = document.getElementById("user_options-forms");

        /**
        * Add event listener to the "Sign Up" button
        */
              signupButton.addEventListener(
        "click",
        () => {
          userForms.classList.remove("bounceRight");
          userForms.classList.add("bounceLeft");
        },
        false
        );

        /**
        * Add event listener to the "Login" button
        */
        loginButton.addEventListener(
        "click",
        () => {
          userForms.classList.remove("bounceLeft");
          userForms.classList.add("bounceRight");
        },
        false
        );

    </script>
  </body>
  </html>

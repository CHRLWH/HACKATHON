<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona de Productos</title>
    <link rel="stylesheet" href="css/Tienda.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Zona de Productos</h1>
            </div>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Chats</a></li>
            </ul>
        </nav>
    </header>

    <div class="sidebar">
        <h3>Categorías</h3>
        <ul>
            <li><a href="#">Ropa</a></li>
            <li><a href="#">Muebles</a></li>
            <li><a href="#">Accesorios</a></li>
            <li><a href="#">Proximamente...</a></li>
        </ul>
    </div>

    <section class="products">
        <h2>Productos Disponibles</h2>
        <div class="product-card">
            <img src="producto1.png" alt="Producto 1">
            <h3>Ropa</h3>
            <p>Variada, poco uso</p>
            <button>Solicitar Chat</button>
        </div>
        <div class="product-card">
            <img src="producto2.png" alt="Producto 2">
            <h3>Cuna</h3>
            <p>Sin uso, Color blanco</p>
            <button>Solicitar Chat</button>
        </div>
        <div class="product-card">
            <img src="producto3.png" alt="Producto 3">
            <h3>Carrito</h3>
            <p>Poco uso, color negro</p>
            <button>Solicitar Chat</button>
        </div>
    </section>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comunidad de madrid home</title>
    
    <link href="css/admin2.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  
  <body class="justify-center">
    <nav class="navbar">
      <a class="navbar-brand" href="#">
        <div class="icon-container">
          <img class="icon hexagon" />
        </div>
        <span class="name">Bienvenido!</span>
      </a>
      <ul class="navbar-nav">
        <li>
          <a class="active"><img class="icon home" /><span>Pagina principal</span></a>
        </li>
        <li>
          <a><img class="icon statistics" /><span>Estadisticas</span></a>
        </li>
        <li>
          <a><img class="icon mail" /><span>Solicitudes</span></a>
        </li>
        <li>
          <a><img class="icon user" /><span>Perfil</span></a>
        </li>
        <li>
          <a><img class="icon file" /><span>Usuarios</span></a>
        </li>
      </ul>
      <div class="navbar-footer">
        <!--SECCION COMO FOOTER-->
        </div>
      </div>
    </nav>
    <main>
      <header>
        <section role="search">
          <form action="#" method="get">
            <div class="form-inline">
              <img class="icon search" />
              <input type="search" placeholder="Search" />
            </div>
          </form>
        </section>
  
        <section role="application">
          <button class="change-view">
            <img class="icon layout" />Change view
          </button>
          <button class="notification">
            <img class="icon notification" />
          </button>
          <button class="menu">
            <img class="icon menu" />
          </button>
        </section>
      </header>
      <h1>Overview</h1>
      
        </section>
        <section role="chart" class="exchange-rates">
          <h3 class="title">Productos</h3>
          <canvas id="exchangeRates"></canvas>
        </section>
        <section role="chart" class="last-costs">
          <h3 class="title">Usuarios</h3>
          <canvas id="last_costs"></canvas>
  
        </section>
        <section role="chart" class="efficiency">
          <h3 class="title">Chats activos</h3>
          <canvas id="efficiency"></canvas>
  
        </section>
      </div>
    </main>
  <script src="javascript/admin2.js"></script>
</body>
</html>

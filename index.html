
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Comunidad de madrid home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

      <body class="bg-dark text-white ">
      <header class="p-3 bg-danger text-white">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <!--Aquí va el logo-->
            <a href="img/Captura de pantalla 2024-10-19 a las 18.34.38.png" class="d-flex align-items-center mb-2 mb-lg-0">
              <img src="img/Captura de pantalla 2024-10-19 a las 18.34.38.png" alt="Comunidad de Madrid Logo" width="45" height="45">
              <svg class="bi me-2" width="40" height="35" role="img" aria-label="ComunidadDeMadrid"></svg>
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 junter mb-md-0 justify-content-center">
              <li class="nav-item">
                <a href="" class="nav-link px2 text-white">Inicio</a>
              </li>
              <li class="nav-item">
                <!--Pagina que explica el objetivo y demás del proyecto y un poco de informacion general-->
                <a href="" class="nav-link px2 text-white">Información</a>
              </li>
              <li class="nav-item">
                <!--Formulario de registro de información, telefono y direccion de mail-->
                <a href="" class="nav-link px2 text-white">Contacto</a>
              </li>
            </ul>
            <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3">
              <input type="search" class="form-control form-control-dark" placeholder="Search..." aria-label="Search">
            </form>
            <div class="text-end">
              <button type="button" class="btn btn-outline-light me-2">Login</button>
              <!--Al pulsar scrollea hasta el registro-->
              <a href="#registro" data-scroll="true" data-scroll-duration="500" class="btn btn-warning">Registro</a>
            </div>
          </div>
        </div>
       </header>

       <hr class="invisible">
       
       <div class="container d-flex justify-content-left alighn-items-center">
        <div class="jumbotron jumbotron-fluid">
          
        </div>
       </div>
       <hr class="invisible">

       <div class="container d-flex justify-content-center alighn-items-center ">
      <div id="registro" class="jumbotron jumbotron-fluid ">
        <h1 class="display-5"> Solicita acceso</h1>
        <form>
          <div class="form-row">

            <div class="form-group col-md-6">
              <label for="inputDni">Dni</label>
              <input type="dni" class="form-control" id="inputDni" placeholder="dni">
            </div>
            <div class="form-group col-md-6">
              <label for="inputNumeroExpedicionDni">Expedicion</label>
              <input type="dni" class="form-control" id="inputNumeroExpedicionDni" placeholder="Numero de expedicion DNI">
            </div>
            <div class="form-group col-md-6">
              <label for="inputNombre">Nombre</label>
              <input type="nombre" class="form-control" id="inputNombre" placeholder="nombre">
            </div>
          </div>
          <div class="form-group">
            <div class="form-group">
              <label for="inputNumeroTelefono">Tlf</label>
              <input type="text" class="form-control" id="inputNumeroTelefono" placeholder="Numero de telefono">
            </div>
          </div>
          <div class="form-group col-md-20">
            <div class="form-group">
              <label for="inputPoblacion">Población</label>
              <input type="text" class="form-control" id="inputPoblacion" placeholder="población">
            </div>
          </div>
          <div class="form-group">
            <div class="form-group">
              <label for="inputCiudad">Calle</label>
              <input type="text" class="form-control" id="inputCalle" placeholder="Calle, numero">
            </div>
          </div>

          <hr class="invisible">

          <div class="form-group">
            <div class="form-group">
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
            
          </div>
          
        </form>
      </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
